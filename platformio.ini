; LilyGO TTGO T3 v1.6.1 (ESP32) + module CC1101 externe (E07-M1101D, 433 MHz)
; Projet : actionner les pagers Retekess T112 en 433 MHz OOK
;
; On EMET desormais avec le CC1101 (bit-bang OOK propre), plus avec le SX1278
; embarque (dont l'OOK etait galere). Le SX1278 reste sur la carte mais on ne
; s'en sert plus -> il faut juste le laisser deselectionne (CS=18 tenu HAUT).
;
; Si l'upload echoue avec "ttgo-lora32-v21" introuvable, remplace la ligne
; board par : board = esp32dev   (les pins sont definies a la main dans le code)

[env:ttgo-lora32-v21]
platform = espressif32
board = ttgo-lora32-v21
framework = arduino
monitor_speed = 115200
; La puce USB CH9102 corrompt l'upload a 921600 (Checksum error) -> on ralentit
upload_speed = 115200
; Vise le port USB de la carte, plus jamais le Bluetooth
upload_port = /dev/cu.wchusbserial*
monitor_port = /dev/cu.wchusbserial*
; permet de taper une commande dans le moniteur et l'envoyer avec Entree
monitor_filters = send_on_enter
monitor_echo = yes
lib_deps =
    ; Driver CC1101 (mode async OOK bit-bang) — pilote de reference pour le replay 433
    ; Fallback si le nom ne resout pas : https://github.com/LSatan/SmartRC-CC1101-Driver-Lib
    lsatan/SmartRC-CC1101-Driver-Lib
    ; Parsing JSON de la reponse pager-poll (petit, rapide)
    bblanchon/ArduinoJson@^7
